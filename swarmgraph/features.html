<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmScope · Behaviour Atlas</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--fg:#1c1c1a;--muted:#6d6c66;--line:#e2e0d8;--sel:#2d5bd7;--faint:rgba(120,118,110,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--panel:#1d1d1b;--fg:#ecebe5;--muted:#9d9b94;
--line:#33322f;--sel:#6f93f2;--faint:rgba(160,158,150,.2)}}
:root[data-theme="dark"]{--bg:#151514;--panel:#1d1d1b;--fg:#ecebe5;--muted:#9d9b94;--line:#33322f;--sel:#6f93f2;--faint:rgba(160,158,150,.2)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;margin:0}.muted{color:var(--muted)}
#info{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:50%;width:24px;height:24px;cursor:pointer;font:600 13px/1 inherit}
.row{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
select,button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--sel)}button:disabled{opacity:.4;cursor:default}
select{min-width:0;flex:0 1 auto;max-width:min(460px,52vw)}
#step{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
#mapwrap{position:relative;min-height:0;margin:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;left:12px;top:10px;max-width:min(460px,62%);pointer-events:none;z-index:2;padding:8px 11px 9px;border-radius:10px;
background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);transition:opacity .35s;opacity:0}
#cap.on{opacity:1}#cap .ph{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
#cap .ph i{width:8px;height:8px;border-radius:50%;display:inline-block}#cap .tp{font-size:16px;font-weight:600;margin-top:2px}
#clock{position:absolute;right:14px;top:10px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);pointer-events:none}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;
box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;z-index:6;max-width:280px}
#card{position:absolute;display:none;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
box-shadow:0 8px 28px rgba(0,0,0,.16);z-index:5}
#card h3{margin:0 18px 4px 0;font-size:14px;font-weight:600}#card .x{position:absolute;right:10px;top:6px;cursor:pointer;color:var(--muted);font-size:18px}
#card .big{font-size:22px;font-weight:600}#card svg{display:block;width:100%;height:36px;margin:6px 0}
#bottom{display:flex;align-items:flex-end;gap:10px;padding:6px 16px 10px}
#play{width:84px}#when{font-variant-numeric:tabular-nums;font-size:13px;min-width:120px;text-align:right;color:var(--muted)}
#strip{flex:1;height:118px;cursor:pointer;touch-action:none}
#over{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:8;align-items:center;justify-content:center}
#over .box{background:var(--panel);border-radius:12px;max-width:760px;width:calc(100% - 32px);max-height:80vh;overflow:auto;padding:16px 18px}

.src{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;font-size:13px;background:var(--bg);border-radius:0 6px 6px 0}
.src .t{font-size:12px;color:var(--muted)}.pick li{cursor:pointer;margin:4px 0}.pick li:hover{color:var(--sel)}
@media (max-width:640px){#cap{max-width:calc(100% - 24px)}#step{display:none}#sub{display:none}#when{min-width:0}header{padding:8px 12px 2px}#bottom{padding-left:12px;padding-right:12px}#mapwrap{margin:0 12px}}
</style></head><body>
<header><h1>SwarmScope</h1><select id="dataset" aria-label="Choose a dataset" style="display:none"></select><span id="sub" class="muted"></span>
  <span class="row"><button id="prev" aria-label="Previous scene">◀</button><select id="pick" aria-label="Choose a story"></select>
    <button id="next" aria-label="Next scene">▶</button><span id="step"></span></span>
  <span style="margin-left:auto"></span><button id="inf" style="display:none" aria-pressed="false" onclick="toggleInf()">Influence</button><button id="why" style="display:none" onclick="showWhy()">Why?</button>
  <button id="evid" style="display:none" onclick="sceneSources()">Evidence</button><button id="info" title="How to read this">?</button></header>
<div id="mapwrap"><canvas id="map"></canvas><div id="cap" aria-live="polite"></div><div id="clock"></div><div id="card"></div></div>
<div id="bottom"><button id="play">▶ Play</button><canvas id="strip"></canvas><span id="when"></span></div>
<div id="tip"></div>
<div id="over"><div class="box"><span class="x" onclick="closeOver()">×</span><div id="obody"></div></div></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STOPS = [[78, 121, 167], [89, 161, 79], [237, 201, 72], [225, 87, 89]];  // early -> late (by amount of work done)
const GRAD = Array.from({length: 101}, (_, i) => { let t = i / 100 * (STOPS.length - 1); const j = Math.min(STOPS.length - 2, Math.floor(t)), f = t - j;
  return STOPS[j].map((v, k) => Math.round(v + (STOPS[j + 1][k] - v) * f)); });
const grad = (t, a = 1) => { const c = GRAD[Math.round(Math.max(0, Math.min(1, t)) * 100)]; return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const day = b => { const [, m, d] = b.split("-"); return `${MON[+m - 1]} ${+d}`; };
const span = (a, b) => a === b ? day(a) : (a.slice(0, 7) === b.slice(0, 7) ? `${day(a)}–${+b.slice(8)}` : `${day(a)} – ${day(b)}`);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const DS = new URLSearchParams(location.search).get("ds");
const api = p => p + (DS ? (p.includes("?") ? "&" : "?") + "ds=" + encodeURIComponent(DS) : "");

let ARC = null, D, S = {stories: []}, P = null, F = {}, ST = [], EDGES = [], binIdx = {}, peakBin = {}, dayWork = [], daily = {};
let FLOW = null, rmarks = [], endTok = 0, INF = null, infOn = false, hoverId = null;  // INF: behaviour -> behaviour influence  // measured by code (docs/FLOW.md): regime boundaries and what spreads
let story = -1, scene = 0, focus = new Set(), picked = null, labelled = [], frameCount = 0, labelKey = "", hotNow = {}, LBLS = {}, labelsMoving = false;
let view = {w0: 0, w1: 1, a: 0, b: 0, mode: "overview"};   // shown range of time (as share of the work done) and its days
let T = 1, speed = 0, playing = false, scenePlay = false, last = 0, shown = {}, pts = [], frameReq = 0;
const map = $("map"), strip = $("strip");
let MW = 0, MH = 0, SW = 0, SH = 0, mctx, sctx;

function share(id, a, b) { const p = D.profiles[id]; let c = 0, n = 0;
  for (let k = a; k <= b; k++) { c += p.units[k] || 0; n += D.n_bin[k] || 0; } return n ? c / n : 0; }
function dayAt(w) { let k = 0; while (k < D.bins.length - 1 && dayWork[k + 1] <= w) k++;
  const f = k < D.bins.length - 1 ? Math.max(0, Math.min(1, (w - dayWork[k]) / Math.max(1e-9, dayWork[k + 1] - dayWork[k]))) : 1; return [k, f]; }
function sizeTargets() {
  if (view.mode === "play") {  // follow the playhead: the day it is in, blended into the next
    const [k, f] = dayAt(T), k2 = Math.min(k + 1, D.bins.length - 1);
    return Object.fromEntries(D.features.map(x => [x.id, daily[x.id][k] * (1 - f) + daily[x.id][k2] * f]));
  }
  return Object.fromEntries(D.features.map(x => [x.id, share(x.id, view.a, view.b)]));
}

function resize() {  // only here, never per frame
  const dpr = devicePixelRatio || 1, r = map.getBoundingClientRect(), q = strip.getBoundingClientRect();
  MW = r.width; MH = r.height; SW = q.width; SH = q.height;
  map.width = Math.round(MW * dpr); map.height = Math.round(MH * dpr); strip.width = Math.round(SW * dpr); strip.height = Math.round(SH * dpr);
  mctx = map.getContext("2d"); mctx.setTransform(dpr, 0, 0, dpr, 0, 0); sctx = strip.getContext("2d"); sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const M = 34, X = x => M + x * (MW - 2 * M), Y = y => M + (1 - y) * (MH - 2 * M);
let COL = {};
function colours() { COL = {fg: css("--fg"), muted: css("--muted"), faint: css("--faint"), panel: css("--panel"), sel: css("--sel"), line: css("--line"), bg: css("--bg")}; }

function loop(now) {
  frameReq = 0;
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  if (playing) { T = Math.min(view.w1, T + speed * dt); if (T >= view.w1 - 1e-9) finished(); }
  const tgt = sizeTargets(); let moving = playing;
  for (const id in tgt) { const s0 = shown[id] ?? tgt[id], s1 = reduced ? tgt[id] : s0 + (tgt[id] - s0) * Math.min(1, dt * 6);
    shown[id] = s1; if (Math.abs(tgt[id] - s1) > 0.001) moving = true; }
  render(dt);
  if (moving || labelsMoving) frameReq = requestAnimationFrame(loop); else last = 0;
}
function kick() {  // a hidden tab gets no animation frames: draw the end state at once instead
  if (document.hidden) { shown = sizeTargets(); if (playing) { T = view.w1; render(); finished(); } else render(); return; }
  if (!frameReq) frameReq = requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && D) kick(); });

function render(dt = 1) {  // dt: seconds since the last frame (1 = jump to the end state)
  const ctx = mctx; ctx.clearRect(0, 0, MW, MH);
  // behaviours: soft dots (size = share of the sampled work in the shown days)
  pts = [];
  const order = D.features.filter(f => D.fpos[f.id]).sort((a, b) => (focus.has(a.id) - focus.has(b.id)) || ((shown[a.id] || 0) - (shown[b.id] || 0)));
  for (const f of order) {
    const v = shown[f.id] || 0, x = X(D.fpos[f.id][0]), y = Y(D.fpos[f.id][1]), r = 3 + 24 * Math.sqrt(v), on = !focus.size || focus.has(f.id);
    pts.push({id: f.id, x, y, r});
    ctx.fillStyle = v > 0.003 ? grad(dayWork[peakBin[f.id]] ?? 0, on ? .32 : .07) : COL.faint; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    if (focus.has(f.id) || picked === f.id) { ctx.strokeStyle = COL.fg; ctx.globalAlpha = .7; ctx.lineWidth = picked === f.id ? 2.4 : 1.2; ctx.stroke(); ctx.globalAlpha = 1; }
  }
  if (infOn && INF) drawInfluence(ctx);
  // traces: a later stretch reusing words another author wrote first; the line grows source -> reuser, then stays faint
  const fresh = view.mode === "overview" ? 0 : Math.max(0.003, speed * 0.9);
  const on = (a, b) => !focus.size || focus.has(ST[a].home) || focus.has(ST[b].home), hot = {};
  for (const e of EDGES) {
    if (e.w < view.w0) continue; if (e.w > T) break; if (view.mode === "overview" && e.n < 8) continue; if (infOn && INF) break;
    const s = ST[e.s], d = ST[e.d], age = fresh ? (T - e.w) / fresh : 9, k = on(e.s, e.d) ? 1 : .2;
    if (age < 1) { hot[s.home] = (hot[s.home] || 0) + 1; hot[d.home] = (hot[d.home] || 0) + 1; }
    const x1 = X(s.x), y1 = Y(s.y), x2 = X(d.x), y2 = Y(d.y), cx = (x1 + x2) / 2 - (y2 - y1) * .22, cy = (y1 + y2) / 2 + (x2 - x1) * .22;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    if (age < 1) { const p = reduced ? 1 : Math.min(1, age * 2.5), qx = x1 + (cx - x1) * p, qy = y1 + (cy - y1) * p, rx = cx + (x2 - cx) * p, ry = cy + (y2 - cy) * p;
      ctx.quadraticCurveTo(qx, qy, qx + (rx - qx) * p, qy + (ry - qy) * p); ctx.strokeStyle = grad(d.wt, (.8 - .55 * age) * k); ctx.lineWidth = 1.6; }
    else { ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.strokeStyle = grad(d.wt, (view.mode === "overview" ? .045 : .09) * k); ctx.lineWidth = 1; }
    ctx.stroke();
  }
  // stretches: a bright mark at their moment, then a small one that stays
  for (const s of ST) {
    if (s.wt < view.w0) continue; if (s.wt > T) break;
    const age = fresh ? (T - s.wt) / fresh : 9, k = !focus.size || focus.has(s.home) ? 1 : .22, x = X(s.x), y = Y(s.y);
    if (age < 1) { hot[s.home] = (hot[s.home] || 0) + .5; ctx.fillStyle = grad(s.wt, .3 * (1 - age) * k); ctx.beginPath(); ctx.arc(x, y, 3 + 6 * (1 - age), 0, 6.283); ctx.fill(); }
    ctx.fillStyle = grad(s.wt, (age < 1 ? .95 : .5) * k); ctx.beginPath(); ctx.arc(x, y, age < 1 ? 2.6 : 1.6, 0, 6.283); ctx.fill();
  }

  // largest; refreshed slowly while time runs so they do not flicker
  const key = `${view.mode}|${story}|${scene}`;
  if (key !== labelKey || view.mode === "overview" || !playing || frameCount++ % 60 === 0) {
    const linked = infLinked();
    const ranked = [...pts].map(p => [p.id, (focus.has(p.id) || linked.has(p.id) ? 1e6 : 0) + (hot[p.id] || 0) * 100 + (shown[p.id] || 0)])
      .filter(([id, v]) => v > 0.004).sort((a, b) => b[1] - a[1]).map(x => x[0]), n = focus.size ? Math.max(8, focus.size) : 12;
    const stay = key === labelKey ? labelled.filter(id => { const r = ranked.indexOf(id); return r >= 0 && r < n + 5; }) : [];  // no churn
    labelled = [...stay, ...ranked.filter(id => !stay.includes(id))].slice(0, n); labelKey = key; hotNow = hot; }
  ctx.font = "12.5px -apple-system, sans-serif"; ctx.textBaseline = "middle";
  const boxes = [], big = labelled.map(id => pts.find(p => p.id === id)).filter(Boolean);
  for (const id in LBLS) { const q = LBLS[id]; if (!labelled.includes(id) && q.a > .25) boxes.push({x: q.x, y: q.y, w: q.tw}); }  // leaving names keep their place
  const ce = $("cap"), cr = ce.classList.contains("on") ? [ce.offsetLeft - 6, ce.offsetTop - 10, ce.offsetLeft + ce.offsetWidth + 6, ce.offsetTop + ce.offsetHeight + 10] : null;
  const clash = (x, y, tw) => x < 4 || x + tw > MW - 4 || y < 10 || y > MH - 22 || (y < 34 && x + tw > MW - 150) || (cr && x < cr[2] && x + tw > cr[0] && y > cr[1] && y < cr[3]) ||
    boxes.some(b => Math.abs(b.y - y) < 16 && x < b.x + b.w + 4 && x + tw + 4 > b.x) ||
    big.some(q => q.x + q.r > x && q.x - q.r < x + tw && q.y + q.r > y - 8 && q.y - q.r < y + 8);
  const placed = {};
  for (const p of big) {
    const t = F[p.id].short, tw = ctx.measureText(t).width, tries = [[p.x + p.r + 6, p.y], [p.x - p.r - 6 - tw, p.y], [p.x - tw / 2, p.y - p.r - 10], [p.x - tw / 2, p.y + p.r + 10]];
    for (let d = 16; d <= 128; d += 16) tries.push([p.x + p.r + 6, p.y - d], [p.x + p.r + 6, p.y + d], [p.x - p.r - 6 - tw, p.y - d], [p.x - p.r - 6 - tw, p.y + d]);
    const fit = tries.find(([x, y]) => !clash(x, y, tw)); if (!fit && !focus.has(p.id)) continue;  // no room: skip it
    let [lx, ly] = fit || tries[0]; lx = Math.max(4, Math.min(MW - tw - 4, lx));
    boxes.push({x: lx, y: ly, w: tw}); placed[p.id] = {x: lx, y: ly, px: p.x, py: p.y, r: p.r, t, tw};

  const k = dt >= 1 || reduced ? 1 : Math.min(1, dt * 5); labelsMoving = false;

    if (want) { if (q.a < .02) Object.assign(q, want); else for (const f of ["x", "y", "px", "py", "r"]) q[f] += (want[f] - q[f]) * k; q.t = want.t; q.tw = want.tw; }
    const target = want ? 1 : 0; q.a += (target - q.a) * k; if (Math.abs(target - q.a) < .01) q.a = target; else labelsMoving = true;
    if (q.a <= 0) { delete LBLS[id]; continue; }
    const base = focus.has(id) || hotNow[id] ? .8 : view.mode === "overview" ? .68 : .45;
    if (Math.hypot(q.x - q.px, q.y - q.py) > q.r + 30) { ctx.strokeStyle = COL.muted; ctx.globalAlpha = .6 * q.a; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(q.px, q.py); ctx.lineTo(q.x < q.px ? q.x + q.tw : q.x, q.y); ctx.stroke(); }

}
let capKey = "", capTimer = 0;
function storyCap() {  // the phase of the arc that the time shown falls in
  const el = $("cap");
  if (!ARC || view.mode === "overview") { if (capKey) { capKey = ""; clearTimeout(capTimer); el.classList.remove("on"); } return; }
  const d = D.bins[Math.min(dayAt(Tin())[0], view.mode === "scene" ? view.b : D.bins.length - 1)], phases = ARC.phases || [];
  const pi = phases.findIndex(p => p.start <= d && d <= p.end), ph = phases[pi], key = ph ? ph.name : "";
  if (key === capKey) return; capKey = key;
  clearTimeout(capTimer); const was = el.classList.contains("on"); el.classList.remove("on");  // fade out, then in
  if (!ph) return;
  const html = `<div class="ph"><i style="background:${grad(dayWork[binIdx[ph.start]] ?? 0)}"></i>Phase ${pi + 1} of ${phases.length} · ${esc(span(ph.start, ph.end))}</div>` +
    `<div class="tp">${esc(ph.name)}</div>`;  // the phase and its days only: what defines it is in the arc
  capTimer = setTimeout(() => { el.innerHTML = html; el.classList.add("on"); kick(); }, was && !reduced ? 360 : 0);
}
const Tin = () => view.mode === "scene" ? Math.min(T, view.w1 - 1e-9) : T;  // a scene ends before the next day's first stretch
function clockText() { const t = Tin(); let lo = 0, hi = ST.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ST[m].wt <= t) lo = m; else hi = m; }
  const s = ST[lo]; return s ? day(s.date.slice(0, 10)) + " · " + s.date.slice(11, 16) : ""; }

const LBL = 58, PH = 18;  // strip: turning-point labels on top, phase bands at the bottom
let marks = [], XS = [];   // XS[k]: where day k starts on the strip (busy days get more room)
function stripScale() { const n = D.bins.length; let acc = 0; XS = [0];
  for (let k = 0; k < n; k++) { const work = (k < n - 1 ? dayWork[k + 1] : 1) - dayWork[k]; acc += .35 / n + .65 * work; XS.push(acc); }
  XS = XS.map(v => v / acc * SW); }
function renderStrip() {
  const ctx = sctx, n = D.bins.length, mx = Math.max(...D.n_bin, 1), top = ARC ? LBL : 4, base = SH - (ARC ? PH : 0) - 2;
  if (XS.length !== n + 1 || Math.abs(XS[n] - SW) > .5) stripScale();
  ctx.clearRect(0, 0, SW, SH);
  ctx.fillStyle = COL.sel; ctx.globalAlpha = .13; ctx.fillRect(XS[view.a], top, XS[view.b + 1] - XS[view.a], base - top); ctx.globalAlpha = 1;
  D.n_bin.forEach((c, k) => { if (!c) return; const bh = Math.max(2, (base - top - 4) * Math.sqrt(c / mx));
    ctx.fillStyle = grad(dayWork[k], k >= view.a && k <= view.b ? 1 : .45); ctx.fillRect(XS[k] + .5, base - bh, Math.max(1, XS[k + 1] - XS[k] - 1), bh); });
  rmarks = [];
  (FLOW?.boundaries || []).forEach(r => { const k = binIdx[r.date]; if (k === undefined) return;  // regime changes found by code
    const x = Math.round(XS[k]) + .5; ctx.strokeStyle = COL.fg; ctx.globalAlpha = .5; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, base); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; rmarks.push({x, r}); });
  if (ARC) {
    ctx.font = "11px -apple-system, sans-serif"; ctx.textBaseline = "middle";

  <p>Each soft dot is a behaviour that AI judges marked in the record. Behaviours that happen at the same times sit close together; a dot's colour is when that behaviour was most common (the same colours as the timeline), its size how much of the sampled work showed it.</p>
  <p>The small marks around a dot are stretches of work showing that behaviour; each is drawn beside the rarest behaviour it shows, so the groups are drawn, not found. A line is drawn when a later stretch reused words another author had written first: it grows from the source to the reuser and then stays as a faint trace, so you can see where text spread.</p>
  <p>Dashed lines on the timeline are where code finds the mix of behaviour changing (the split of time that best predicts sampled work it was not fitted on); point at one to see what rose and fell. A behaviour's card says whether it passes between actors: how much more often a stretch shows it after a stretch it could have seen (copied words, a reply, a mention, the same place) showed it, net of that week's trend. These are associations, not proof of influence.</p>
  <p>Influence draws arrows from a behaviour to the behaviours others do more after seeing it (thicker = a larger change in the odds, net of each agent's usual level, the day and what happened at the same time without contact); a loop on a dot means the behaviour itself passes on. Point at a dot to see only its arrows: blue = what it brings on, dark = what brings it on.</p>
  <p>Choose a story to step through what happened; Evidence shows the records behind a scene. Click a mark to read that stretch, a dot to see that behaviour, the timeline to go to any moment.</p>` +
  (D.how || []).slice(1, 3).map(x => `<p class="muted" style="font-size:13px">${esc(x)}</p>`).join(""));
addEventListener("resize", () => { resize(); stripScale(); kick(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { colours(); kick(); });

fetch("/api/datasets").then(r => r.json()).then(list => { if (!Array.isArray(list) || list.length < 2) return;
  const el = $("dataset"); el.innerHTML = list.map(d => `<option value="${esc(d.id)}">${esc(d.label)}</option>`).join("");
  el.value = DS && list.some(d => d.id === DS) ? DS : list[0].id; el.style.display = "";
  el.onchange = () => { location.search = "?ds=" + encodeURIComponent(el.value); }; }).catch(() => {});
(async () => {
  notice("Loading the map…");
  [D, S, P] = await Promise.all([fetch(api("/api/features")).then(r => r.json()), fetch(api("/api/feature_storylines")).then(r => r.json()).catch(() => ({})),
    fetch(api("/api/spread")).then(r => r.json()).catch(() => ({stretches: [], edges: []}))]);
  if (D.error) { notice(esc(D.error)); return; }
  notice("");
  S.stories = (S.status === "ready" && Array.isArray(S.stories) ? S.stories : []).map(s => ({...s, scenes: (s.scenes || []).filter(c => typeof c.caption === "string")})).filter(s => s.scenes.length);
  D.features.forEach(f => { F[f.id] = f; f.short = (D.short || {})[f.id] || f.text.split(/\s+/).slice(0, 4).join(" "); }); D.bins.forEach((b, k) => binIdx[b] = k);
  ARC = S.arc && (S.arc.turning_points || []).length ? S.arc : null;
  if (ARC) {  // the arc is the first story: one scene per turning point, highlighting what rose that day
    ARC.turning_points.sort((a, b) => a.date < b.date ? -1 : 1);
    const rose = d => { const k = binIdx[d]; if (k === undefined) return [];
      const before = k2 => { let c = 0, n = 0; for (let q = Math.max(0, k2 - 3); q < k2; q++) { n += D.n_bin[q]; } return n; };
      return D.features.map(f => { const p = D.profiles[f.id].units, n0 = before(k); let c0 = 0; for (let q = Math.max(0, k - 3); q < k; q++) c0 += p[q];
        return [f.id, (D.n_bin[k] ? p[k] / D.n_bin[k] : 0) - (n0 ? c0 / n0 : 0)]; }).sort((a, b) => b[1] - a[1]).slice(0, 4).filter(x => x[1] > 0.02).map(x => x[0]); };
    S.stories.unshift({title: "The arc — " + ARC.title, isArc: true, scenes: ARC.turning_points.map(tp => ({title: tp.title, start: tp.date, end: tp.date,
      caption: `${tp.title}. ${tp.what_changed} ${tp.why_it_matters}`, features: rose(tp.date), events: tp.events || []}))});
  }
  // stretches in time order; time is measured as the share of the work done so far
  const order = (P.stretches || []).map((r, i) => [r, i]).sort((a, b) => a[0][1] - b[0][1]), pos = [];
  ST = order.map(([r, i], k) => { pos[i] = k; return {id: r[0], t: r[1], x: r[2], y: r[3], home: r[4], judged: r[5], who: r[6], date: r[7], inn: 0, out: 0}; });
  ST.forEach((s, i) => s.wt = ST.length > 1 ? i / (ST.length - 1) : 0);
  EDGES = (P.edges || []).map(([s, d, n]) => ({s: pos[s], d: pos[d], n})).map(e => ({...e, w: ST[e.d].wt})).sort((a, b) => a.w - b.w);
  EDGES.forEach(e => { ST[e.d].inn++; ST[e.s].out++; });
  let j = 0; dayWork = D.bins.map(b => { while (j < ST.length && ST[j].date.slice(0, 10) < b) j++; return ST.length ? Math.min(1, j / Math.max(1, ST.length - 1)) : 0; });
  D.features.forEach(f => { let best = 0, bv = -1; const u = D.profiles[f.id].units;
    daily[f.id] = D.bins.map((_, k) => { let c = 0, n = 0; for (let q = Math.max(0, k - 1); q <= Math.min(D.bins.length - 1, k + 1); q++) { c += u[q] || 0; n += D.n_bin[q] || 0; } return n ? c / n : 0; });
    u.forEach((c, k) => { const n = D.n_bin[k]; if (n >= 10 && c / n > bv) { bv = c / n; best = k; } }); peakBin[f.id] = best; });
  $("sub").textContent = `${span(D.bins[0], D.bins[D.bins.length - 1])} · ${D.features.length} behaviours · ${EDGES.length.toLocaleString()} traces of reused words`;
  $("pick").innerHTML = `<option value="-1">${S.stories.length ? "Overview — choose a story" : "Overview"}</option>` + S.stories.map((s, i) => `<option value="${i}">${esc(s.title)}</option>`).join("");
  colours(); resize(); overview();
  fetch(api("/api/influence")).then(r => r.json()).then(x => { if (x.error || !(x.links || []).length) return; INF = x; $("inf").style.display = ""; }).catch(() => {});
  fetch(api("/api/flow")).then(r => r.json()).then(x => { if (x.error) return; FLOW = x; renderStrip();
  }).catch(() => {});
})();
</script></body></html>
